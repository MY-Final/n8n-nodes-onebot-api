# This workflow automatically publishes to npm when:
# 1. A release is created, OR
# 2. Code is pushed to refactor branch with package.json changes
name: Publish to npm

on:
  release:
    types: [created]
  push:
    branches: [refactor]
    paths:
      - 'package.json'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # 1. 获取 package.json 中的核心字段：版本号和真实的包名
      - name: Get info from package.json
        id: pkg-info
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          echo "name=$(node -p "require('./package.json').name")" >> $GITHUB_OUTPUT

      # 2. 检查该版本是否已存在于 npm
      - name: Check if version already exists on npm
        id: check-version
        run: |
          # 如果包是第一次发布，npm view 会报错，所以用 || true 忽略
          REMOTE_VERSIONS=$(npm view ${{ steps.pkg-info.outputs.name }} versions --json 2>/dev/null || echo "[]")
          if echo "$REMOTE_VERSIONS" | grep -q "${{ steps.pkg-info.outputs.version }}"; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Version ${{ steps.pkg-info.outputs.version }} already exists. Skipping..."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # 3. 执行发布 (使用 --ignore-scripts 绕过 n8n-node 的拦截)
      - name: Publish to npm
        if: steps.check-version.outputs.exists == 'false'
        run: npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_token }}

      # 4. 创建 GitHub Release (可选，如果你是 push 触发的话很有用)
      - name: Create GitHub Release
        if: github.event_name == 'push' && steps.check-version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg-info.outputs.version }}
          name: Release v${{ steps.pkg-info.outputs.version }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
